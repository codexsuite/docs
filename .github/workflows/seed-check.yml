name: Seed check

# Runs the demo seed modules against a stack with an empty database. Red while a module is still the stub.
on:
  push:
    branches: [main, feat/cdx-1-docs-site]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        part: [structure, references, all]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm tsx scripts/checks/seed-check.ts --part ${{ matrix.part }}

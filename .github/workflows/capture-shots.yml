name: Capture shots

# Dispatched by `pnpm shots:ci`. Starts the published images on this runner, captures the
# requested shots in both themes and uploads them as the "shots" artifact.
on:
  workflow_dispatch:
    inputs:
      page:
        description: Page key, such as ui-library, or all
        required: true
        type: string
      shot:
        description: Only shots whose name starts with this
        required: false
        default: ""
        type: string
      tag:
        description: Lets the dispatcher find its own run
        required: false
        default: ""
        type: string

run-name: Capture ${{ inputs.page }} ${{ inputs.tag }}

permissions:
  contents: read

concurrency:
  group: capture-${{ inputs.tag || github.run_id }}

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Capture
        env:
          PAGE: ${{ inputs.page }}
          SHOT: ${{ inputs.shot }}
        run: |
          args=(--page "$PAGE" --out "$RUNNER_TEMP/shots")
          if [ -n "$SHOT" ]; then args+=(--shot "$SHOT"); fi
          pnpm shots "${args[@]}"

      - uses: actions/upload-artifact@v5
        with:
          name: shots
          path: ${{ runner.temp }}/shots/*.webp
          if-no-files-found: error

      - name: Remove anything left behind
        if: always()
        run: |
          docker ps -aq | xargs -r docker rm -f
          docker volume ls -q | xargs -r docker volume rm

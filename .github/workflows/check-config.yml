name: Check configuration reference

# Fails when the variables or groups in src/content/docs/start/configuration.mdx differ
# from the Configuration table in the README on the main branch of codexsuite/codex.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-config-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: codexsuite/codex
          ref: main
          path: product

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check:config product/README.md
